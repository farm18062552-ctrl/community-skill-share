<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Skill Share - แพลตฟอร์มแลกเปลี่ยนความรู้</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="#" class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                🤝 Community Skill Share
            </a>
            <div id="auth-buttons" class="flex items-center gap-3">
                <button id="btn-login" class="px-4 py-2 text-sm font-medium text-indigo-600 hover:bg-indigo-50 rounded-lg transition">
                    เข้าสู่ระบบ
                </button>
                <button id="btn-register" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition shadow-sm">
                    ลงทะเบียน
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-12 px-4 text-center">
        <h1 class="text-3xl md:text-5xl font-bold mb-4">แลกเปลี่ยนความรู้ เติบโตไปด้วยกัน</h1>
        <p class="text-indigo-100 text-lg max-w-2xl mx-auto mb-6">พื้นที่สำหรับแบ่งปันความถนัด ทักษะ และการเรียนรู้ร่วมกันในชุมชนและโรงเรียนของเรา</p>
        <button id="btn-create-skill" class="bg-white text-indigo-600 hover:bg-slate-100 font-semibold px-6 py-3 rounded-full shadow-lg transition">
            + แบ่งปันทักษะของคุณ
        </button>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h2 class="text-2xl font-bold text-slate-800">ทักษะทั้งหมดที่เปิดสอน/แลกเปลี่ยน</h2>
            <!-- Search & Filter -->
            <div class="w-full md:w-auto flex gap-2">
                <input type="text" id="search-input" placeholder="ค้นหาทักษะ..." class="w-full md:w-64 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <!-- Skill Cards Grid -->
        <div id="skills-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- โค้ด JavaScript จะมา Render การ์ดลงตรงนี้ -->
            <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-48"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-48"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-48"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm">
        <p>© 2026 Community Skill Share Project. All rights reserved.</p>
    </footer>

    <!-- App Main Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
